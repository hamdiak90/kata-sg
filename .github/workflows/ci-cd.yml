name: ci-cd

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read       

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:         
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer les dépendances de test
        run: pip install -r backend/requirements-dev.txt
      - name: Lancer les tests
        run: pytest -v backend
  deploy:
    needs: test             
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write         
    env:
      RG: rg-kata
      ACR: acrkatahamdi  
      TAG: ${{ github.sha }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Connexion à Azure (OIDC, sans secret)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Créer le registre d'images
        run: |
          az acr create --name "$ACR" --resource-group "$RG" --sku Basic --output none

      - name: Construire et pousser les images
        run: |
          az acr login --name "$ACR"
          docker build -t "$ACR.azurecr.io/api:$TAG" backend
          docker build -t "$ACR.azurecr.io/web:$TAG" frontend
          docker push "$ACR.azurecr.io/api:$TAG"
          docker push "$ACR.azurecr.io/web:$TAG"