name: ci-cd

on:
  push:
    branches: [main]    # chaque push sur main
  workflow_dispatch:    # bouton « Run workflow »

permissions:
  contents: read        # le jeton GitHub peut seulement lire le code

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false   # on ne coupe jamais un déploiement en cours

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:         # base jetable pour les tests, supprimée à la fin du job
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer les dépendances de test
        run: pip install -r backend/requirements-dev.txt
      - name: Lancer les tests
        run: pytest -v backend

  deploy:
    needs: test               # seulement si les tests passent
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write         # pour demander le jeton OIDC à GitHub
    env:
      RG: rg-kata
      LOCATION: francecentral
      ACR: acrkatahamdi      
      ENV_NAME: cae-kata
      PG: pg-kata-hamdi   
      TAG: ${{ github.sha }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Connexion à Azure (OIDC, sans secret)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Créer le registre d'images (s'il n'existe pas)
        run: |
          if az acr show --name "$ACR" --resource-group "$RG" --output none 2>/dev/null; then
            echo "Le registre $ACR existe déjà"
          else
            az acr create --name "$ACR" --resource-group "$RG" --sku Basic --output none
          fi

      - name: Construire et pousser les images
        run: |
          az acr login --name "$ACR"
          docker build -t "$ACR.azurecr.io/api:$TAG" backend
          docker build -t "$ACR.azurecr.io/web:$TAG" frontend
          docker push "$ACR.azurecr.io/api:$TAG"
          docker push "$ACR.azurecr.io/web:$TAG"

      - name: Créer l'environnement Container Apps (s'il n'existe pas)
        run: |
          # L'espace de logs reçoit les logs des conteneurs (plafond : 1 Go par jour)
          if ! az monitor log-analytics workspace show --name law-kata --resource-group "$RG" --output none 2>/dev/null; then
            az monitor log-analytics workspace create --name law-kata --resource-group "$RG" \
              --location "$LOCATION" --quota 1 --output none
          fi
          if ! az containerapp env show --name "$ENV_NAME" --resource-group "$RG" --output none 2>/dev/null; then
            LAW_ID=$(az monitor log-analytics workspace show --name law-kata --resource-group "$RG" --query customerId --output tsv)
            LAW_KEY=$(az monitor log-analytics workspace get-shared-keys --name law-kata --resource-group "$RG" --query primarySharedKey --output tsv)
            az containerapp env create --name "$ENV_NAME" --resource-group "$RG" --location "$LOCATION" \
              --logs-workspace-id "$LAW_ID" --logs-workspace-key "$LAW_KEY" --output none
          fi
      - name: Créer Application Insights (s'il n'existe pas)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          if ! az monitor app-insights component show --app appin-kata --resource-group "$RG" --output none 2>/dev/null; then
            LAW_RID=$(az monitor log-analytics workspace show --name law-kata --resource-group "$RG" --query id --output tsv)
            az monitor app-insights component create --app appin-kata --resource-group "$RG" \
              --location "$LOCATION" --workspace "$LAW_RID" --output none
          fi
      - name: Créer la base PostgreSQL (si elle n'existe pas)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::Le secret DB_PASSWORD n'existe pas : crée-le avec gh secret set"
            exit 1
          fi
          # 0.0.0.0 = accès autorisé depuis Azure seulement ; mot de passe et TLS obligatoires
          # --output none : sinon la commande affiche le mot de passe dans les logs
          if ! az postgres flexible-server show --name "$PG" --resource-group "$RG" --output none 2>/dev/null; then
            az postgres flexible-server create --name "$PG" --resource-group "$RG" --location "$LOCATION" \
              --tier Burstable --sku-name Standard_B1ms --storage-size 32 --version 16 \
              --admin-user appadmin --admin-password "$DB_PASSWORD" \
              --public-access 0.0.0.0 --yes --output none
          fi
          if ! az postgres flexible-server db show --server-name "$PG" --resource-group "$RG" --name app --output none 2>/dev/null; then
            az postgres flexible-server db create --server-name "$PG" --resource-group "$RG" --name app --output none
          fi

      - name: Déployer l'API
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          DOMAIN=$(az containerapp env show --name "$ENV_NAME" --resource-group "$RG" --query properties.defaultDomain --output tsv)
          if ! az containerapp show --name api --resource-group "$RG" --output none 2>/dev/null; then
            # Première fois seulement. Le CLI essaie aussi de donner lui-même le droit AcrPull :
            # il échoue au bout d'une minute (le pipeline n'a pas ce droit) et continue.
            # C'est normal, le droit existe déjà grâce au bootstrap.
            PULL_IDENTITY=$(az identity show --name id-kata-pull --resource-group "$RG" --query id --output tsv)
            az containerapp create --name api --resource-group "$RG" --environment "$ENV_NAME" \
              --image "$ACR.azurecr.io/api:$TAG" \
              --registry-server "$ACR.azurecr.io" --registry-identity "$PULL_IDENTITY" \
              --ingress external --target-port 8000 \
              --min-replicas 2 --max-replicas 6 \
              --scale-rule-name http-rule --scale-rule-http-concurrency 10 \
              --output none
          fi
          # Chaîne de connexion App Insights : traitée comme un secret
          AI_CS=$(az monitor app-insights component show --app appin-kata --resource-group "$RG" --query connectionString --output tsv)
          az containerapp secret set --name api --resource-group "$RG" \
            --secrets db-password="$DB_PASSWORD" appinsights-cs="$AI_CS" --output none
          # À chaque push : la nouvelle image, donc une nouvelle révision
          az containerapp update --name api --resource-group "$RG" \
            --image "$ACR.azurecr.io/api:$TAG" \
            --set-env-vars APP_VERSION="$TAG" WEB_ORIGIN="https://web.$DOMAIN" \
              DB_HOST="$PG.postgres.database.azure.com" DB_USER=appadmin \
              DB_PASSWORD=secretref:db-password DB_SSLMODE=require \
              APPLICATIONINSIGHTS_CONNECTION_STRING=secretref:appinsights-cs \
              TRACE_SAMPLING_RATIO=0.1 \
            --output none
            
      - name: Déployer le front
        run: |
          DOMAIN=$(az containerapp env show --name "$ENV_NAME" --resource-group "$RG" --query properties.defaultDomain --output tsv)
          if ! az containerapp show --name web --resource-group "$RG" --output none 2>/dev/null; then
            PULL_IDENTITY=$(az identity show --name id-kata-pull --resource-group "$RG" --query id --output tsv)
            az containerapp create --name web --resource-group "$RG" --environment "$ENV_NAME" \
              --image "$ACR.azurecr.io/web:$TAG" \
              --registry-server "$ACR.azurecr.io" --registry-identity "$PULL_IDENTITY" \
              --ingress external --target-port 8080 \
              --min-replicas 1 --max-replicas 3 \
              --output none
          fi
          az containerapp update --name web --resource-group "$RG" \
            --image "$ACR.azurecr.io/web:$TAG" \
            --set-env-vars API_URL="https://api.$DOMAIN" \
            --output none
          echo "Application en ligne : https://web.$DOMAIN"