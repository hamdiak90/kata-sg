name: ci-cd

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false   # pour que ça ne coupe pas un deploy in progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read 

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:         # base jetable pour les tests, supprimée à la fin du job
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Installer les dépendances de test
        run: pip install -r backend/requirements-dev.txt
      - name: Lancer les tests
        run: pytest -v backend
  deploy:
    needs: test               # le deploy se joue que quand les tests sont OK
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write         # pour demander le jeton OIDC à GitHub
    env:
      RG: rg-kata
    steps:
      - name: Connexion à Azure (OIDC, sans secret)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Vérifier l'accès au groupe de ressources
        run: az group show -n "$RG" -o table