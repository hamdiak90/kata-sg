services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app 
    ports:
      - "5432:5432"         
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped   
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_USER: app
      DB_PASSWORD: app
      DB_SSLMODE: disable
      APP_VERSION: local
      CHAOS_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      API_URL: http://localhost:8000
    depends_on:
      - api
