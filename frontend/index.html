<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kata App</title>
  <script src="config.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1f2328; }
    form { display: flex; gap: 8px; margin: 16px 0; }
    input { flex: 1; padding: 8px; font-size: 15px; }
    button { padding: 8px 14px; font-size: 15px; cursor: pointer; }
    #status { font-size: 13px; color: #59636e; }
    .error { color: #b3261e !important; }
    li { padding: 2px 0; }
  </style>
</head>
<body>
  <h1>Kata App</h1>
  <p id="status">Connexion à l'API…</p>
  <button id="refresh" type="button">Rafraîchir</button>

  <form id="form">
    <input id="name" placeholder="Nouvel item" maxlength="100" required>
    <button type="submit">Ajouter</button>
  </form>
  <ul id="items"></ul>

  <script>
    const API = window.API_URL || "http://localhost:8000";
    const statusEl = document.getElementById("status");

    function showError(text) {
      statusEl.textContent = text;
      statusEl.className = "error";
    }

    // Affiche la réplica qui a répondu : on la voit changer quand l'app scale.
    async function loadInfo() {
      try {
        const r = await fetch(API + "/api/info");
        const d = await r.json();
        statusEl.textContent = `API OK — réplica ${d.hostname} — version ${d.version}`;
        statusEl.className = "";
      } catch (e) {
        showError("API injoignable, réessayez dans quelques secondes.");
      }
    }

    async function loadItems() {
      try {
        const r = await fetch(API + "/api/items");
        if (r.status === 503) return showError("Base de données indisponible : le service revient dès qu'elle répond.");
        if (!r.ok) return showError(`Erreur ${r.status}`);
        const ul = document.getElementById("items");
        ul.innerHTML = "";
        for (const item of await r.json()) {
          const li = document.createElement("li");
          li.textContent = item.name;  // textContent : pas d'injection HTML
          ul.appendChild(li);
        }
      } catch (e) {
        showError("API injoignable, réessayez dans quelques secondes.");
      }
    }

    async function refresh() {
      await loadInfo();
      await loadItems();
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("name");
      const r = await fetch(API + "/api/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: input.value })
      }).catch(() => null);
      if (!r || !r.ok) return showError("Ajout impossible pour le moment.");
      input.value = "";
      loadItems();
    });

    document.getElementById("refresh").addEventListener("click", refresh);
    refresh();
  </script>
</body>
</html>
